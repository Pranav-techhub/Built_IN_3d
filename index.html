<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TECHFEST // BEYOND THE CODE 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: '#050608',
                card: '#0c0e14',
                cyan: '#00f0ff',
                pink: '#ff007f',
                purple: '#7000ff',
                text: '#f0f4f8',
                muted: '#8a99ad',
                border: '#1b2234'
              }
            },
            fontFamily: {
              mono: ['Fira Code', 'monospace'],
              sans: ['Inter', 'sans-serif']
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              glow: {
                '0%': { boxShadow: '0 0 10px rgba(0, 240, 255, 0.3)' },
                '100%': { boxShadow: '0 0 25px rgba(0, 240, 255, 0.8), 0 0 50px rgba(112, 0, 255, 0.4)' },
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cyber-bg text-cyber-text overflow-x-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
